# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  pull_request:

jobs:
  maven-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Git Checkout (clog)
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Checkout Sakai
        uses: actions/checkout@v4
        with:
          repository: sakaiproject/sakai
          ref: 25.x
          path: sakai

      - name: Install Sakai dependencies needed by clog
        run: >
          mvn -B install -DskipTests -Dmaven.javadoc.skip=true
          -f sakai/pom.xml
          -pl kernel/api,kernel/kernel-util,kernel/component-manager,search/search-api
          -am

      - name: Build with Maven
        env:
          MAVEN_OPTS: -Djava.awt.headless=true -Dorg.slf4j.simpleLogger.defaultLogLevel=info -Dmaven.wagon.http.retryHandler.count=2 -Dmaven.wagon.http.pool=true
        run: mvn clean install -Psnapshots -V -B
